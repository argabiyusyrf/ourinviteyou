<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Undangan · Faisal & Detika</title>
  <meta name="theme-color" content="#1a0f0d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%231a0f0d'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%239e6b4d' stroke-width='1.5'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-style='italic' fill='%23c08866' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E" />
  <link rel="preload" href="assets/fonts/cormorant-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/greatvibes-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .admin { padding: clamp(40px, 8vw, 80px) 0; }
    .admin__header { text-align: center; margin-bottom: 40px; }
    .admin__header h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.8rem, 4vw, 2.4rem); color: var(--ivory); }
    .admin__header p { color: var(--muted); margin-top: 8px; }
    .admin__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 20px; max-width: 1000px; margin-inline: auto; }
    .admin__card { background: linear-gradient(160deg, #3d2318 0%, #1f110c 60%, #1a0f0d 100%); border: 1px solid rgba(158, 107, 77, .2); border-radius: 20px; padding: 24px; }
    .admin__card h3 { font-family: var(--serif); font-weight: 600; font-size: 1.1rem; color: var(--ivory); margin-bottom: 12px; }
    .admin__field { margin-bottom: 14px; }
    .admin__field label { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--cream); margin-bottom: 8px; }
    .admin__field input { width: 100%; padding: 10px 14px; background: rgba(243, 239, 228, .05); border: 1px solid rgba(158, 107, 77, .24); border-radius: 12px; color: var(--ivory); font-family: var(--sans); font-size: .9rem; }
    .admin__field input:focus { outline: none; border-color: rgba(158, 107, 77, .7); box-shadow: 0 0 0 3px rgba(158, 107, 77, .13); }
    .admin__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .admin__list { max-height: 420px; overflow-y: auto; margin-top: 16px; }
    .admin__item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-bottom: 1px solid rgba(233, 227, 208, .08); }
    .admin__item:last-child { border-bottom: 0; }
    .admin__item-info { min-width: 0; }
    .admin__item-name { font-size: .88rem; font-weight: 500; color: var(--ivory); overflow-wrap: anywhere; }
    .admin__item-meta { font-size: .76rem; color: var(--muted); margin-top: 2px; }
    .admin__empty { text-align: center; color: var(--muted); padding: 32px 16px; font-size: .9rem; }
    .admin__toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(16, 40, 27, .96); border: 1px solid rgba(158, 107, 77, .4); color: var(--ivory); padding: 12px 24px; border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; z-index: 90; }
    .admin__toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <main class="admin">
    <div class="container">
      <header class="admin__header">
        <h1>Manajemen Undangan</h1>
        <p>Buat tautan undangan dan kelola daftar tamu.</p>
      </header>

      <div class="admin__grid">
        <section class="admin__card">
          <h3>Buat Tautan Undangan</h3>
          <div class="admin__field">
            <label for="guestNameInput">Nama Tamu</label>
            <input type="text" id="guestNameInput" placeholder="Contoh: Arga Abiyyu" maxlength="60" />
          </div>
          <div class="admin__actions">
            <button type="button" class="btn btn--gold btn--sm" id="generateBtn"><span>Buat Tautan</span></button>
            <button type="button" class="btn btn--ghost btn--sm" id="copyBtn">Salin Tautan</button>
          </div>
          <p class="admin__field" style="margin-top:14px;font-size:.82rem;color:var(--muted);word-break:break-all;" id="linkPreview"></p>
        </section>

        <section class="admin__card">
          <h3>Daftar Tamu</h3>
          <div class="admin__list" id="guestList">
            <p class="admin__empty">Belum ada tamu. Buat tautan undangan terlebih dahulu.</p>
          </div>
          <div class="admin__actions">
            <button type="button" class="btn btn--ghost btn--sm" id="exportBtn">Ekspor JSON</button>
            <button type="button" class="btn btn--ghost btn--sm" id="clearBtn">Hapus Semua</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div class="admin__toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const GUEST_KEY = 'fd-guests-v1';
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    function toast(msg, ms = 2400) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.add('is-show');
      setTimeout(() => el.classList.remove('is-show'), ms);
    }

    function loadGuests() {
      try { return JSON.parse(localStorage.getItem(GUEST_KEY) || '[]'); } catch (e) { return []; }
    }
    function saveGuests(list) { localStorage.setItem(GUEST_KEY, JSON.stringify(list)); }

    function renderGuests() {
      const list = loadGuests();
      const container = $('#guestList');
      if (!list.length) { container.innerHTML = '<p class="admin__empty">Belum ada tamu. Buat tautan undangan terlebih dahulu.</p>'; return; }
      container.innerHTML = list.map((g, i) => `
        <div class="admin__item">
          <div class="admin__item-info">
            <div class="admin__item-name">${escapeHtml(g.name)}</div>
            <div class="admin__item-meta">${g.slug} · ${new Date(g.t).toLocaleString('id-ID')}</div>
          </div>
          <button class="btn btn--ghost btn--sm" data-copy-slug="${escapeHtml(g.slug)}">Salin</button>
        </div>
      `).join('');
      container.querySelectorAll('[data-copy-slug]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const slug = btn.getAttribute('data-copy-slug');
          const url = location.origin + '/undangan/' + slug;
          await navigator.clipboard.writeText(url).catch(() => {});
          toast('Tautan tersalin: ' + url);
        });
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
    }

    function toSlug(str) {
      return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    $('#generateBtn').addEventListener('click', () => {
      const raw = $('#guestNameInput').value.trim();
      if (!raw) { toast('Isi nama tamu dulu.'); return; }
      const slug = toSlug(raw);
      const list = loadGuests();
      if (!list.find((g) => g.slug === slug)) {
        list.push({ name: raw, slug, t: Date.now() });
        saveGuests(list);
      }
      const url = location.origin + '/undangan/' + slug;
      $('#linkPreview').textContent = url;
      renderGuests();
      toast('Tautan undangan berhasil dibuat.');
    });

    $('#copyBtn').addEventListener('click', async () => {
      const text = $('#linkPreview').textContent.trim();
      if (!text) { toast('Buat tautan terlebih dahulu.'); return; }
      await navigator.clipboard.writeText(text).catch(() => {});
      toast('Tautan tersalin.');
    });

    $('#exportBtn').addEventListener('click', () => {
      const list = loadGuests();
      const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'daftar-tamu-undangan.json';
      a.click();
      toast('Daftar tamu diekspor.');
    });

    $('#clearBtn').addEventListener('click', () => {
      if (!confirm('Hapus semua data tamu?')) return;
      localStorage.removeItem(GUEST_KEY);
      renderGuests();
      toast('Data tamu dihapus.');
    });

    renderGuests();
  </script>
</body>
</html>
